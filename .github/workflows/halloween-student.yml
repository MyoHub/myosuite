name: Halloween student dependencies

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'tutorials/4.5_Halloween_Avoidance*'
      - 'tutorials/files/halloween/requirements-student.txt'
      - '.github/workflows/halloween-student.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  colab-package-compatibility:
    name: Colab package compatibility (Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Create the student environment
        run: |
          uv venv --python "${{ matrix.python }}" .venv-student
          uv pip install --python .venv-student/bin/python pip
      - name: Install the reported Colab packages first
        run: |
          .venv-student/bin/python -m pip install \
            numba==0.61.2 datasets==4.8.5 gradio==6.30.0 diffusers==0.41.0
      - name: Seed an older MyoSuite build with the same package version
        run: |
          .venv-student/bin/python -m pip install --no-deps \
            "myosuite @ git+https://github.com/MyoHub/myosuite.git@230f198458b501c423a0892b78da60419ffc49a3"
      - name: Install the lesson and check the entire environment
        run: |
          .venv-student/bin/python -m pip install --upgrade \
            -r tutorials/files/halloween/requirements-student.txt
          MYOSUITE_REQUIREMENT=$(head -n 1 tutorials/files/halloween/requirements-student.txt)
          .venv-student/bin/python -m pip install --force-reinstall --no-deps "$MYOSUITE_REQUIREMENT"
          .venv-student/bin/python -m pip check
      - name: Import the resolved scientific and Colab packages
        run: |
          .venv-student/bin/python - <<'PY'
          import numpy, jax, scipy, huggingface_hub, PIL
          import numba, datasets, gradio, diffusers
          print('NumPy:', numpy.__version__)
          print('Hugging Face Hub:', huggingface_hub.__version__)
          print('Pillow:', PIL.__version__)
          PY
      - name: Verify installed feature revision and tutorial APIs outside the checkout
        run: |
          .venv-student/bin/python -I - <<'PY'
          import json
          from importlib.metadata import distribution
          from pathlib import Path
          from myosuite import make_env
          from myosuite.integrations.musclemimic import download_terrain_checkpoint
          from myosuite.integrations.musclemimic.halloween import HalloweenController
          from myosuite.utils.video_io import write_video

          requirement = Path('tutorials/files/halloween/requirements-student.txt').read_text().splitlines()[0]
          expected = requirement.rsplit('@', 1)[1]
          installed = json.loads(distribution('myosuite').read_text('direct_url.json'))
          assert installed['vcs_info']['commit_id'] == expected
          env = make_env('myoHalloween-v0', profile='terra')
          try:
              obs, info = env.reset(seed=2027)
              assert obs.shape == (535,)
              assert env.action_space.shape == (354,)
          finally:
              env.close()
          print('Installed feature revision, tutorial imports and task reset verified.')
          PY
