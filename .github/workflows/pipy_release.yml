# adapted from
# - https://medium.com/@VersuS_/automate-pypi-releases-with-github-actions-4c5a9cfe947d
# - https://github.com/facebookresearch/fairscale/blob/main/.github/workflows/release.yml
name: MyoSuite PyPI Release

# on: [push]
# on:
#  push:
#    tags:
#     - '*'
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release action: major/minor/patch prepares a version bump on dev; current publishes the version already promoted to main"
        type: choice
        options: [patch, minor, major, current]
        default: patch
        required: true

# Default to read-only. Only the version-preparation job may advance dev, and
# only the tag job may create a release tag. main is never mutated here.
permissions:
  contents: read

# Only one release may tag/publish at a time.
concurrency:
  group: pypi-release
  cancel-in-progress: false
# # Upon running the following instructions
# # > git tag 0.0.1 # or whatever version you want
# # > git push origin --tags
# Release contract:
# 1. major/minor/patch prepares that version bump on dev and does not publish.
# 2. Promote dev -> main through the normal PR/CI flow.
# 3. current publishes exactly the version already committed on main after
#    validating main/dev parity and main freshness.



jobs:
  # Resolve the version already committed on main. Version bumps belong in
  # the normal dev -> main PR flow, where branch protection and CI apply.
  get_next_version:
    runs-on: ubuntu-latest

    steps:
      # A release is immutable: cut it only from the current main commit.
      - name: release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch the release from main (got $GITHUB_REF)."
          exit 1

      - name: checkout-repo-content
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: get next version and tag
        id: get-next-version-and-tag
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          output=$(python3 .github/release_utils.py --release-type "$RELEASE_TYPE")
          echo $output
          new_version=$(echo $output | awk '{print $1}')
          new_tag=$(echo $output | awk '{print $2}')
          echo "new version is $new_version"
          echo "new tag is $new_tag"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
    outputs:
      new_version: ${{ steps.get-next-version-and-tag.outputs.version }}
      new_tag: ${{ steps.get-next-version-and-tag.outputs.tag }}

  prepare_version_bump:
    name: Prepare version bump on dev
    if: inputs.release_type != 'current'
    runs-on: ubuntu-latest
    needs: get_next_version
    permissions:
      contents: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: true

      - name: Verify dev still matches main
        id: verify
        run: |
          git fetch origin main dev
          main_tree=$(git rev-parse origin/main^{tree})
          dev_tree=$(git rev-parse origin/dev^{tree})
          dev_sha=$(git rev-parse origin/dev)
          if [ "$main_tree" != "$dev_tree" ]; then
            echo "::error::dev and main already differ. Promote/reconcile them before preparing another release."
            exit 1
          fi
          echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"

      - name: Update version files
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          EXPECTED_VERSION: ${{ needs.get_next_version.outputs.new_version }}
        run: |
          python3 .github/release_utils.py --release-type "$RELEASE_TYPE" --update-version
          actual=$(python3 .github/release_utils.py --release-type current | awk '{print $1}')
          if [ "$actual" != "$EXPECTED_VERSION" ]; then
            echo "::error::Updated version $actual does not match expected $EXPECTED_VERSION."
            exit 1
          fi

      - name: Commit and push version bump to dev
        env:
          NEW_VERSION: ${{ needs.get_next_version.outputs.new_version }}
          EXPECTED_DEV_SHA: ${{ steps.verify.outputs.dev_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add myosuite/version.py
          if [ -f uv.lock ]; then git add uv.lock; fi
          if git diff --cached --quiet; then
            echo "::error::Requested ${{ inputs.release_type }} bump produced no version-file change."
            exit 1
          fi
          git commit -m "chore: bump version to $NEW_VERSION"
          git push --force-with-lease=refs/heads/dev:$EXPECTED_DEV_SHA origin HEAD:refs/heads/dev

      - name: Promotion required
        run: |
          echo "::notice::Prepared version ${{ needs.get_next_version.outputs.new_version }} on dev."
          echo "::notice::Promote dev to main through the normal PR/CI flow, then dispatch this workflow with release_type=current to publish."

  pypi_package_build_and_release:
    name: Validate and build PyPI distributions
    if: inputs.release_type == 'current'
    runs-on: ubuntu-latest
    needs: get_next_version
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install build tooling
      run: pip install build setuptools wheel

    - name: Verify release source is current main and matches dev
      run: |
        git fetch origin main dev --tags
        main_sha=$(git rev-parse origin/main)
        main_tree=$(git rev-parse origin/main^{tree})
        dev_tree=$(git rev-parse origin/dev^{tree})

        if [ "$GITHUB_SHA" != "$main_sha" ]; then
          echo "::error::main moved after this release was dispatched. Re-run from the latest main."
          exit 1
        fi

        if [ "$main_tree" != "$dev_tree" ]; then
          echo "::error::main and dev do not contain the same files. Promote dev -> main before releasing."
          exit 1
        fi

        if ! git diff --quiet || ! git diff --cached --quiet; then
          echo "::error::Release checkout is unexpectedly dirty."
          exit 1
        fi

    # Build before creating any tag or publishing anything.
    - name: Build distributions
      run: python3 -m build

    - name: Verify built package version
      env:
        EXPECTED_VERSION: ${{ needs.get_next_version.outputs.new_version }}
      run: |
        python3 - <<'PY'
        import glob
        import zipfile
        from email.parser import Parser
        import os

        wheels = glob.glob("dist/*.whl")
        if len(wheels) != 1:
            raise SystemExit(f"Expected exactly one wheel, found: {wheels}")
        with zipfile.ZipFile(wheels[0]) as zf:
            metadata_name = next(n for n in zf.namelist() if n.endswith(".dist-info/METADATA"))
            metadata = Parser().parsestr(zf.read(metadata_name).decode())
        actual = metadata["Version"]
        expected = os.environ["EXPECTED_VERSION"]
        if actual != expected:
            raise SystemExit(f"Built wheel version {actual} != expected {expected}")
        print(f"Verified wheel version {actual}")
        PY

    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
  create_release_tag:
    name: Validate tips and create release tag
    runs-on: ubuntu-latest
    needs: [get_next_version, pypi_package_build_and_release]
    permissions:
      contents: write
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # GitHub's updateRefs mutation evaluates all beforeOid conditions
      # server-side and applies all ref updates atomically. main/dev are no-op
      # freshness guards. The tag is either created conditionally or guarded
      # as an existing no-op ref on an idempotent retry.
      - name: Validate tips and create release tag atomically
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_TAG: ${{ needs.get_next_version.outputs.new_tag }}
        run: |
          git fetch origin main dev --tags
          main_sha=$(git rev-parse origin/main)
          dev_sha=$(git rev-parse origin/dev)
          main_tree=$(git rev-parse origin/main^{tree})
          dev_tree=$(git rev-parse origin/dev^{tree})
          head_sha=$(git rev-parse HEAD)

          if [ "$GITHUB_SHA" != "$main_sha" ]; then
            echo "::error::main moved while the release was building. Re-run from the latest main."
            exit 1
          fi
          if [ "$main_tree" != "$dev_tree" ]; then
            echo "::error::main and dev diverged while the release was building."
            exit 1
          fi

          repo_id=$(gh api graphql \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){id}}' \
            -f owner="${GITHUB_REPOSITORY%/*}" \
            -f name="${GITHUB_REPOSITORY#*/}" \
            --jq '.data.repository.id')

          zero=0000000000000000000000000000000000000000
          tag_before="$zero"
          if git rev-parse -q --verify "refs/tags/$NEW_TAG" >/dev/null; then
            tagged_sha=$(git rev-list -n 1 "$NEW_TAG")
            if [ "$tagged_sha" != "$head_sha" ]; then
              echo "::error::Tag $NEW_TAG already exists but resolves to $tagged_sha, not $head_sha."
              exit 1
            fi
            tag_before=$(git rev-parse "refs/tags/$NEW_TAG")
            echo "Tag $NEW_TAG already resolves to this release commit; guarding it atomically."
          fi

          mutation='mutation($repo:ID!,$updates:[RefUpdate!]!){updateRefs(input:{repositoryId:$repo,refUpdates:$updates}){clientMutationId}}'
          jq -nc \
            --arg query "$mutation" \
            --arg repo "$repo_id" \
            --arg main "$main_sha" \
            --arg dev "$dev_sha" \
            --arg tag "refs/tags/$NEW_TAG" \
            --arg tag_before "$tag_before" \
            --arg head "$head_sha" \
            '{
              query:$query,
              variables:{
                repo:$repo,
                updates:[
                  {name:"refs/heads/main", beforeOid:$main, afterOid:$main, force:false},
                  {name:"refs/heads/dev", beforeOid:$dev, afterOid:$dev, force:false},
                  {name:$tag, beforeOid:$tag_before, afterOid:$head, force:false}
                ]
              }
            }' > /tmp/update-refs.json

          gh api graphql --input /tmp/update-refs.json

  publish_to_pypi:
    name: Publish PyPI wheel
    runs-on: ubuntu-latest
    needs: [get_next_version, pypi_package_build_and_release, create_release_tag]
    outputs:
      release_version: ${{ needs.get_next_version.outputs.new_version }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  test_latest_PyPI:
    needs: publish_to_pypi
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y xvfb x11-xserver-utils
          sudo /usr/bin/Xvfb $DISPLAY -screen 0 1280x1024x24 &


      - shell: bash
        env:
          RELEASE_VERSION: ${{ needs.publish_to_pypi.outputs.release_version }}
        run: |
          echo "Test exact MyoSuite PyPI release"
          for attempt in 1 2 3 4 5 6; do
            if pip install --no-cache-dir "myosuite==$RELEASE_VERSION" scipy pytest; then
              break
            fi
            if [ "$attempt" = 6 ]; then
              echo "::error::myosuite==$RELEASE_VERSION did not become installable from PyPI."
              exit 1
            fi
            sleep 20
          done
          python -c "import myosuite; assert myosuite.__version__ == '$RELEASE_VERSION', myosuite.__version__"
          python -m pytest -o addopts= -p no:cacheprovider --pyargs myosuite.tests.test_myo
