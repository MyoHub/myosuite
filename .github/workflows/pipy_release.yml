# adapted from
# - https://medium.com/@VersuS_/automate-pypi-releases-with-github-actions-4c5a9cfe947d
# - https://github.com/facebookresearch/fairscale/blob/main/.github/workflows/release.yml
name: MyoSuite PyPI Release

# on: [push]
# on:
#  push:
#    tags:
#     - '*'
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Release Type (current = release version.py as-is, major, minor, patch)'
        type: choice
        options: [patch, minor, major, current]
        default: 'patch'
        required: true

# Default to read-only. The build/release job gets contents: write only for
# the branch/tag updates it performs with GITHUB_TOKEN.
permissions:
  contents: read

# Only one release may mutate main/dev at a time.
concurrency:
  group: pypi-release
  cancel-in-progress: false
# # Upon running the following instructions
# # > git tag 0.0.1 # or whatever version you want
# # > git push origin --tags
# # The following operations will be run
# # 1. Update version according to major | minor | patch and use the new version as `tag name`
# # 2. Use the `tag name` as `release version`
# # 3. Build the PyPI package by using /myosuite/__init__.py version
# # 4. Upload the package
# # 5. Test Upload



jobs:
  # 1. Update version according to major | minor | patch and use the new version as `tag name`
  get_next_version:
    runs-on: ubuntu-latest

    steps:
      # The release commit is pushed to main and the wheel is built from the
      # dispatched ref, so a release must never be cut from another branch.
      - name: release from main only
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch the release from main (got $GITHUB_REF)."
          exit 1

      - name: checkout-repo-content
        uses: actions/checkout@v4

      - name: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: get next version and tag
        id: get-next-version-and-tag
        env:
          RELEASE_TYPE: ${{ inputs.name }}  # via env, never spliced into the script
        run: |
          output=$(python3 .github/release_utils.py --release-type "$RELEASE_TYPE")
          echo $output
          new_version=$(echo $output | awk '{print $1}')
          new_tag=$(echo $output | awk '{print $2}')
          echo "new version is $new_version"
          echo "new tag is $new_tag"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"
    outputs:
      new_version: ${{ steps.get-next-version-and-tag.outputs.version }}
      new_tag: ${{ steps.get-next-version-and-tag.outputs.tag }}

  pypi_package_build_and_release:
    name: Build PyPI wheel
    runs-on: ubuntu-latest
    needs: get_next_version
    permissions:
      contents: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        persist-credentials: true

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install pypa/setuptools
      run: |
        pip install build setuptools wheel

    # update the version number in version.py and uv.lock
    - name: update version
      id: update-version
      env:
        RELEASE_TYPE: ${{ inputs.name }}
      run : |
        echo "current folder = $PWD"
        echo "current branch = $(git branch --show-current)"
        output=$(python3 .github/release_utils.py --release-type "$RELEASE_TYPE" --update-version)
        if [ "$RELEASE_TYPE" = "current" ] && ! git diff --quiet -- myosuite/version.py uv.lock 2>/dev/null; then
          echo "::error::A current release must not modify version files."
          exit 1
        fi

    # The release flow is dev -> main. Promotion may use a merge, squash,
    # rebase, or fast-forward, so compare repository trees rather than ancestry.
    # Record the exact remote tips we validated; the push step uses them as
    # leases so concurrent branch updates cannot be overwritten.
    - name: Verify dev has been promoted to main
      if: inputs.name != 'current'
      id: verify-branches
      run: |
        git fetch origin main dev
        main_sha=$(git rev-parse origin/main)
        dev_sha=$(git rev-parse origin/dev)
        main_tree=$(git rev-parse origin/main^{tree})
        dev_tree=$(git rev-parse origin/dev^{tree})

        if [ "$main_tree" != "$dev_tree" ]; then
          echo "::error::main and dev do not contain the same files. Promote dev -> main before releasing."
          exit 1
        fi

        if [ "$GITHUB_SHA" != "$main_sha" ]; then
          echo "::error::main moved after this release was dispatched. Re-run the release from the latest main."
          exit 1
        fi

        echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
        echo "dev_sha=$dev_sha" >> "$GITHUB_OUTPUT"

    # commit and push version.py and uv.lock updates
    - name: Commit updated version files
      if: inputs.name != 'current'
      env:
        NEW_VERSION: ${{ needs.get_next_version.outputs.new_version }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add myosuite/version.py
        # Add uv.lock if it exists (git will only stage if modified)
        if [ -f uv.lock ]; then
          git add uv.lock
        fi
        # "current" leaves the files unchanged; only commit a real bump.
        if ! git diff --cached --quiet; then
          git commit -m "chore: bump version to $NEW_VERSION"
          # Advance both branches to the release commit. Explicit leases bind
          # the update to the exact remote tips validated above. This safely
          # reconciles squash/rebase histories while rejecting concurrent pushes.
          git push --atomic --force-with-lease=main:${{ steps.verify-branches.outputs.main_sha }} --force-with-lease=dev:${{ steps.verify-branches.outputs.dev_sha }} origin HEAD:main HEAD:dev
        fi

    - name: Verify release Git authentication
      run: |
        if ! git ls-remote origin HEAD >/dev/null; then
          echo "::error::GITHUB_TOKEN cannot authenticate to this repository."
          exit 1
        fi

    # 2. Use the `tag name` as `release version`
    - uses: mukunku/tag-exists-action@78009d2b13e10ba051fe68d8d2f6778a9b2adab3  # v1.4.0
      id: checkTag
      with:
        tag: ${{ needs.get_next_version.outputs.new_tag }}

    - name: Create release tag
      env:
        NEW_TAG: ${{ needs.get_next_version.outputs.new_tag }}
        TAG_EXISTS: ${{ steps.checkTag.outputs.exists }}
      run: |
        if [ "$TAG_EXISTS" = "true" ]; then
          remote_tag=$(git ls-remote --tags origin "refs/tags/$NEW_TAG" | awk '{print $1}')
          head_sha=$(git rev-parse HEAD)
          if [ "$remote_tag" != "$head_sha" ]; then
            echo "::error::Tag $NEW_TAG already exists but does not point to this release commit."
            exit 1
          fi
          echo "Tag $NEW_TAG already points to this release commit; reusing it."
        else
          git tag "$NEW_TAG"
          git push origin "refs/tags/$NEW_TAG"
        fi


     # 3. Build the PyPI packeage
    - name: Build a binary wheel
      run: >-
        python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
  publish_to_pypi:
    name: Publish PyPI wheel
    runs-on: ubuntu-latest
    needs: pypi_package_build_and_release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  test_latest_PyPI:
    needs: publish_to_pypi
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Prepare Linux
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y xvfb x11-xserver-utils
          sudo /usr/bin/Xvfb $DISPLAY -screen 0 1280x1024x24 &


      - shell: bash
        run: |
          echo "Test MyoSuite PyPI wheel"
          pip install -U myosuite scipy pytest
          python -m pytest -o addopts= -p no:cacheprovider --pyargs myosuite.tests.test_myo
