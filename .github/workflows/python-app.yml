# This workflow installs Python dependencies and runs tests using uv.

name: Python application

on:
  push:
    branches: ["main", "dev"]
    paths-ignore:
      - "docs/**"
      - "**/README.md"

  pull_request:
    branches: ["main", "dev"]
    paths-ignore:
      - "docs/**"
      - "**/README.md"

permissions:
  contents: read
  pull-requests: write

jobs:
  core:
    name: Core (${{ matrix.os }}, py${{ matrix.python-version }})

    defaults:
      run:
        shell: bash -l {0}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        python-version: ["3.10"]
        # 3.14 runs on Linux only: it exercises the full suite, and the risks it
        # guards (dependency resolution, Python-level incompatibilities) are
        # OS-independent. The [mjlab] extra resolves to torch + warp-lang here,
        # since mjlab caps itself at <3.14 upstream.
        include:
          - os: ubuntu-latest
            python-version: "3.14"

    steps:
      - name: Set environment variable for macOS
        if: ${{ runner.os == 'macOS' }}
        run: echo "SYSTEM_VERSION_COMPAT=0" >> $GITHUB_ENV

      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Prepare Linux (headless OpenGL for MuJoCo / notebooks)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y xvfb libgl1 libegl1
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "MUJOCO_GL=egl" >> $GITHUB_ENV
          sudo /usr/bin/Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1

      - name: Install project and pytest
        run: |
          uv pip install -e ".[mjlab]"
          uv pip install pytest pytest-xvfb ffmpeg torch ipython musclemimic_models

      - name: Pytest tier-1 (fast, backend-agnostic contracts)
        if: ${{ runner.os != 'Linux' }}
        run: uv run python -m pytest -o addopts= myosuite/tests -m "tier1 and not slow" -v

      - name: Pytest — full suite (tier 1–3, all backends; excludes @slow)
        if: ${{ runner.os == 'Linux' }}
        run: uv run python -m pytest -o addopts= myosuite/tests -v -m "not slow"

      # Pinned to 3.10: several tutorials depend on packages with tighter ceilings
      # than the library itself (e.g. deprl requires Python <=3.11.5).
      - name: Execute tutorials (discovered; HF-heavy notebooks skipped in CI)
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.10' }}
        run: source myosuite/tests/test_tutorials.sh
