# This workflow installs Python dependencies and runs tests using uv.

name: Python application

on:
  push:
    branches: ["main", "dev"]
    paths: &code_paths
      - "**"
      # Docs, markdown and tooling config never change what the tests exercise.
      - "!docs/**"
      - "!**/*.md"
      - "!.pre-commit-config.yaml"
      - "!CITATION.cff"
      # training/<method>/ projects are outside this suite; no workflow runs their tests.
      - "!training/**"
      # Other workflows do not change the tests; this one and the probe test_newton_compat_probe imports do.
      - "!.github/**"
      - ".github/workflows/python-app.yml"
      - ".github/newton_probe/**"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main", "dev"]
    paths: *code_paths

  # Nightly full run of dev, including the @slow tests no other run selects.
  # Schedules fire from the default branch (main) and run main's copy of this file,
  # so this starts, and later edits apply, only once they are released to main.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# github.ref is refs/pull/<number>/merge on a pull request, so two PRs that
# share a branch name do not cancel each other. On a push it is the branch ref.
# Only PR runs cancel superseded ones; every push to main/dev and nightly run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.group }})
    # A draft pull request skips this job. ready_for_review runs it when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    defaults:
      run:
        shell: bash -l {0}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # PRs into dev run Ubuntu 3.10 only; macOS, Windows and Python 3.14 run
      # after the merge (push to dev), on release PRs into main and nightly.
      # 3.10 is the floor and still resolves NumPy 2.2.x; 3.14 is the ceiling and
      # runs on Linux only, since dependency resolution and Python-level
      # incompatibilities (NumPy >=2.3) are OS-independent. mjlab caps itself at <3.14.
      matrix:
        # On Linux 3.10 the suite runs as two parallel jobs: `mjlab` (tests marked
        # by conftest.py as using mjlab / MuJoCo Warp) and `cpu` (everything else).
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'dev' && '[{"os":"ubuntu-latest","python-version":"3.10","group":"cpu"},{"os":"ubuntu-latest","python-version":"3.10","group":"mjlab"}]' || '[{"os":"ubuntu-latest","python-version":"3.10","group":"cpu"},{"os":"ubuntu-latest","python-version":"3.10","group":"mjlab"},{"os":"macos-latest","python-version":"3.10","group":"all"},{"os":"windows-latest","python-version":"3.10","group":"all"},{"os":"ubuntu-latest","python-version":"3.14","group":"all"}]') }}

    steps:
      - name: Set environment variable for macOS
        if: ${{ runner.os == 'macOS' }}
        run: echo "SYSTEM_VERSION_COMPAT=0" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The nightly run tests dev; a PR checks out its merge commit, whose
          # first parent is the base branch (needed to list the changed files).
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD)
          else
            changed="(not a pull request)"
          fi
          printf '%s\n' "$changed"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || grep -qE '^tutorials/|^myosuite/tests/(execute_tutorial\.py|test_tutorials\.sh)$' <<< "$changed"; then
            echo "tutorials=true" >> "$GITHUB_OUTPUT"
          else
            echo "tutorials=false" >> "$GITHUB_OUTPUT"
          fi
          # testmon tracks Python code only. Data files under myosuite/ (MJCF, meshes,
          # baselines), tutorials (tests read notebooks and checkpoints), dependencies,
          # test plumbing or this workflow need the full suite.
          if grep -E '^myosuite/' <<< "$changed" | grep -qvE '\.py$'; then
            echo "only_python=false" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(tutorials/|pyproject\.toml|uv\.lock|myosuite/tests/conftest\.py|myosuite/tests/support/|\.github/workflows/python-app\.yml)' <<< "$changed"; then
            echo "only_python=false" >> "$GITHUB_OUTPUT"
          else
            echo "only_python=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Prepare Linux (headless OpenGL for MuJoCo / notebooks)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y xvfb libgl1 libegl1
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "MUJOCO_GL=egl" >> $GITHUB_ENV
          sudo /usr/bin/Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1

      # Gait clips, model releases and checkpoints the tests fetch from Hugging Face.
      # Per group (each fetches different files), saved under a fresh key every run
      # so newly pinned revisions are kept; restore takes the latest prefix match.
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hf-${{ runner.os }}-${{ matrix.group }}-
            hf-${{ runner.os }}-

      # [rl] (Stable-Baselines3) so the SB3 tests run instead of skipping, among
      # them the tier-1 SB3 -> ONNX export check (test_export_onnx.py).
      - name: Install project and pytest
        run: |
          uv pip install -e ".[mjlab,rl]"
          uv pip install pytest pytest-xvfb pytest-benchmark pytest-testmon ffmpeg torch ipython "musclemimic_models==1.0.6" usd-core

      - name: Pytest tier-1 (fast, backend-agnostic contracts)
        if: ${{ runner.os != 'Linux' }}
        run: uv run python -m pytest -o addopts= myosuite/tests -m "tier1 and not slow" -v

      # One process per job: with pytest-xdist, two workers already reach ~14 GB on
      # the mjlab tests (16 GB runners) and offscreen MuJoCo rendering can abort a worker.
      # Affected-test selection (pytest-testmon) for the Linux 3.10 groups: every push
      # to dev records which code each test runs; a PR into dev restores that record
      # and runs only the tests whose code it changed.
      - name: Restore testmon data
        id: testmon
        if: ${{ runner.os == 'Linux' && matrix.group != 'all' && github.base_ref == 'dev' }}
        uses: actions/cache/restore@v4
        with:
          path: .testmondata
          key: testmon-${{ matrix.group }}-${{ github.event.pull_request.base.sha }}
          restore-keys: testmon-${{ matrix.group }}-

      - name: Pytest — full suite (tier 1–3, all backends; excludes @slow)
        if: ${{ runner.os == 'Linux' }}
        env:
          SELECT: ${{ matrix.group == 'cpu' && 'not slow and not mjlab' || matrix.group == 'mjlab' && 'not slow and mjlab' || 'not slow' }}
          # select: PR into dev with Python-only changes and a recorded baseline.
          # record: push to dev (the baseline for later PRs). Otherwise run everything.
          TESTMON: ${{ (github.base_ref == 'dev' && steps.changes.outputs.only_python == 'true' && steps.testmon.outputs.cache-matched-key != '') && 'select' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.group != 'all') && 'record' || 'off' }}
        run: |
          echo "testmon: $TESTMON"
          case "$TESTMON" in
            select)
              # Exit code 5: no test is affected by the change.
              uv run python -m pytest -o addopts= myosuite/tests -v -m "$SELECT" --testmon-forceselect || [ $? -eq 5 ] ;;
            record)
              uv run python -m pytest -o addopts= myosuite/tests -v -m "$SELECT" --testmon ;;
            *)
              uv run python -m pytest -o addopts= myosuite/tests -v -m "$SELECT" ;;
          esac

      - name: Save testmon data
        if: ${{ runner.os == 'Linux' && matrix.group != 'all' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/cache/save@v4
        with:
          path: .testmondata
          key: testmon-${{ matrix.group }}-${{ github.sha }}

      # @slow tests (benchmarks, long rollouts) only on the nightly run.
      - name: Pytest — slow tests (nightly)
        if: ${{ runner.os == 'Linux' && matrix.group == 'cpu' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: uv run python -m pytest -o addopts= myosuite/tests -v -m slow

      # Pinned to 3.10: several tutorials depend on packages with tighter ceilings
      # than the library itself. On a PR into dev, only when it touches tutorials;
      # every push, release PR and nightly run executes them.
      - name: Execute tutorials (discovered; HF-heavy notebooks skipped in CI)
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.10' && matrix.group == 'cpu' && (github.base_ref != 'dev' || steps.changes.outputs.tutorials == 'true') }}
        run: source myosuite/tests/test_tutorials.sh
