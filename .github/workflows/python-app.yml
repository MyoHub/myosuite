# This workflow installs Python dependencies and runs tests using uv.

name: Python application

on:
  push:
    branches: ["main", "dev"]
    paths: &code_paths
      - "**"
      # Docs, markdown and tooling config never change what the tests exercise.
      - "!docs/**"
      - "!**/*.md"
      - "!.pre-commit-config.yaml"
      - "!CITATION.cff"
      # training/<method>/ projects carry their own tests.
      - "!training/**"
      # Other workflows do not change the tests; this one does.
      - "!.github/**"
      - ".github/workflows/python-app.yml"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main", "dev"]
    paths: *code_paths

  # Nightly full run of dev, including the @slow tests no other run selects.
  # Schedules fire from the default branch (main), so this starts with the next release.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# github.ref is refs/pull/<number>/merge on a pull request, so two PRs that
# share a branch name do not cancel each other. On a push it is the branch ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, py${{ matrix.python-version }})
    # A draft pull request skips this job. ready_for_review runs it when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    defaults:
      run:
        shell: bash -l {0}

    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # PRs into dev run Ubuntu 3.10 only; macOS, Windows and Python 3.14 run
      # after the merge (push to dev), on release PRs into main and nightly.
      # 3.10 is the floor and still resolves NumPy 2.2.x; 3.14 is the ceiling and
      # runs on Linux only, since dependency resolution and Python-level
      # incompatibilities (NumPy >=2.3) are OS-independent. mjlab caps itself at <3.14.
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'dev' && '[{"os":"ubuntu-latest","python-version":"3.10"}]' || '[{"os":"ubuntu-latest","python-version":"3.10"},{"os":"macos-latest","python-version":"3.10"},{"os":"windows-latest","python-version":"3.10"},{"os":"ubuntu-latest","python-version":"3.14"}]') }}

    steps:
      - name: Set environment variable for macOS
        if: ${{ runner.os == 'macOS' }}
        run: echo "SYSTEM_VERSION_COMPAT=0" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The nightly run tests dev; a PR checks out its merge commit, whose
          # first parent is the base branch (needed to list the changed files).
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
          else
            changed="(not a pull request)"
          fi
          printf '%s\n' "$changed"
          if [ "${{ github.event_name }}" != "pull_request" ] || grep -qE '^tutorials/|^myosuite/tests/(execute_tutorial\.py|test_tutorials\.sh)$' <<< "$changed"; then
            echo "tutorials=true" >> "$GITHUB_OUTPUT"
          else
            echo "tutorials=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Prepare Linux (headless OpenGL for MuJoCo / notebooks)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y xvfb libgl1 libegl1
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "MUJOCO_GL=egl" >> $GITHUB_ENV
          sudo /usr/bin/Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1

      # [rl] (Stable-Baselines3) so the SB3 tests run instead of skipping, among
      # them the tier-1 SB3 -> ONNX export check (test_export_onnx.py).
      - name: Install project and pytest
        run: |
          uv pip install -e ".[mjlab,rl]"
          uv pip install pytest pytest-xvfb pytest-benchmark ffmpeg torch ipython "musclemimic_models==1.0.6" usd-core

      - name: Pytest tier-1 (fast, backend-agnostic contracts)
        if: ${{ runner.os != 'Linux' }}
        run: uv run python -m pytest -o addopts= myosuite/tests -m "tier1 and not slow" -v

      - name: Pytest — full suite (tier 1–3, all backends; excludes @slow)
        if: ${{ runner.os == 'Linux' }}
        run: uv run python -m pytest -o addopts= myosuite/tests -v -m "not slow"

      # @slow tests (benchmarks, long rollouts) only on the nightly run.
      - name: Pytest — slow tests (nightly)
        if: ${{ runner.os == 'Linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: uv run python -m pytest -o addopts= myosuite/tests -v -m slow

      # Pinned to 3.10: several tutorials depend on packages with tighter ceilings
      # than the library itself. On a PR into dev, only when it touches tutorials;
      # every push, release PR and nightly run executes them.
      - name: Execute tutorials (discovered; HF-heavy notebooks skipped in CI)
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.10' && (github.base_ref != 'dev' || steps.changes.outputs.tutorials == 'true') }}
        run: source myosuite/tests/test_tutorials.sh
