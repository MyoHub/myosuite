# This workflow installs Python dependencies and runs tests using uv.

name: Python application

on:
  push:
    branches: ["main", "dev"]
    paths: &code_paths
      - "**"
      # Docs, markdown and tooling config never change what the tests exercise.
      - "!docs/**"
      - "!**/*.md"
      - "!.pre-commit-config.yaml"
      - "!CITATION.cff"
      # training/<method>/ projects are outside this suite; no workflow runs their tests.
      - "!training/**"
      # Other workflows do not change the tests; this one and the probe test_newton_compat_probe imports do.
      - "!.github/**"
      - ".github/workflows/python-app.yml"
      - ".github/newton_probe/**"

  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main", "dev"]
    paths: *code_paths

  # Nightly full run of dev, including the @slow tests no other run selects.
  # Schedules fire from the default branch (main) and run main's copy of this file,
  # so this starts, and later edits apply, only once they are released to main.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# github.ref is refs/pull/<number>/merge on a pull request, so two PRs that
# share a branch name do not cancel each other. On a push it is the branch ref.
# PR runs and pushes to dev cancel superseded ones (the newer dev push records
# the testmon baseline). Pushes to main and nightly runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/dev') }}

permissions:
  contents: read

jobs:
  core:
    name: Core (${{ matrix.os }}, py${{ matrix.python-version }}, ${{ matrix.group }})
    # A draft pull request skips this job. ready_for_review runs it when marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    defaults:
      run:
        shell: bash -el -o pipefail {0}

    runs-on: ${{ matrix.os }}
    # A healthy job takes 6-17 min. Without a limit, a runner that dies (e.g. out of
    # memory) is only failed by GitHub after ~55 min (run 45377018327).
    timeout-minutes: 30
    # Tests and sourced tutorial scripts must keep the fresh pip resolution.
    env:
      UV_NO_SYNC: "true"
    strategy:
      fail-fast: false
      # PRs into dev run Ubuntu 3.11 only; macOS, Windows and Python 3.13 / 3.15 run
      # after the merge (push to dev), on release PRs into main and nightly. CI
      # starts at 3.11, the recommended default (3.10 stays installable but is not
      # tested); 3.13 tests the NumPy 2.5+ (>=3.12) wheel line together with mjlab
      # (<3.14); 3.15 (ONNX-free native CPU path) covers the newest Python. Both run
      # on Linux only, since dependency resolution and Python-level
      # incompatibilities are OS-independent.
      matrix:
        # On Linux 3.11 and 3.13 (the mjlab lines) the suite runs as two parallel jobs: `mjlab` (tests marked
        # by conftest.py as using mjlab / MuJoCo Warp) and `cpu` (everything else).
        include: ${{ fromJSON(github.event_name == 'pull_request' && github.base_ref == 'dev' && '[{"os":"ubuntu-latest","python-version":"3.11","group":"cpu"},{"os":"ubuntu-latest","python-version":"3.11","group":"mjlab"}]' || '[{"os":"ubuntu-latest","python-version":"3.11","group":"cpu"},{"os":"ubuntu-latest","python-version":"3.11","group":"mjlab"},{"os":"macos-latest","python-version":"3.11","group":"all"},{"os":"windows-latest","python-version":"3.11","group":"all"},{"os":"ubuntu-latest","python-version":"3.13","group":"cpu"},{"os":"ubuntu-latest","python-version":"3.13","group":"mjlab"},{"os":"ubuntu-latest","python-version":"3.15","group":"all"}]') }}

    steps:
      - name: Set environment variable for macOS
        if: ${{ runner.os == 'macOS' }}
        run: echo "SYSTEM_VERSION_COMPAT=0" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The nightly run tests dev; a PR checks out its merge commit, whose
          # first parent is the base branch (needed to list the changed files).
          ref: ${{ github.event_name == 'schedule' && 'dev' || '' }}
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}

      - name: Detect changed paths
        id: changes
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            changed=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD)
          else
            changed="(not a pull request)"
          fi
          printf '%s\n' "$changed"
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] || grep -qE '^tutorials/|^myosuite/tests/(execute_tutorial\.py|test_tutorials\.sh)$' <<< "$changed"; then
            echo "tutorials=true" >> "$GITHUB_OUTPUT"
          else
            echo "tutorials=false" >> "$GITHUB_OUTPUT"
          fi
          # testmon tracks Python code only. Data files under myosuite/ (MJCF, meshes,
          # baselines), tutorials (tests read notebooks and checkpoints), dependencies,
          # test plumbing or this workflow need the full suite. Consume both sides
          # of the pipe: grep -q can SIGPIPE its upstream under pipefail.
          if grep -E '^myosuite/' <<< "$changed" | grep -vE '\.py$' > /dev/null; then
            echo "only_python=false" >> "$GITHUB_OUTPUT"
          elif grep -qE '^(tutorials/|pyproject\.toml|uv\.lock|myosuite/tests/conftest\.py|myosuite/tests/support/|\.github/workflows/python-app\.yml)' <<< "$changed"; then
            echo "only_python=false" >> "$GITHUB_OUTPUT"
          # Registration runs at import, before testmon starts recording coverage.
          elif grep -qE '^myosuite/(.*/)?__init__\.py$|^myosuite/core/(registry|config)\.py$|^myosuite/envs/myo/backends/mjlab/(register[^/]*|mimic_mjlab_env|tasks/registration)\.py$|^myosuite/envs/myo/tasks/.*/specs/' <<< "$changed"; then
            echo "only_python=false" >> "$GITHUB_OUTPUT"
          else
            echo "only_python=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Create virtual environment
        run: uv venv --python ${{ matrix.python-version }}

      - name: Prepare Linux (headless OpenGL for MuJoCo / notebooks)
        if: ${{ runner.os == 'Linux' }}
        run: |
          sudo apt-get -o Acquire::Retries=3 update -y -qq
          sudo apt-get -o Acquire::Retries=3 install -y xvfb libgl1 libegl1
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "MUJOCO_GL=egl" >> $GITHUB_ENV
          sudo /usr/bin/Xvfb :99 -screen 0 1280x1024x24 &
          sleep 1

      # Gait clips, model releases and checkpoints the tests fetch from Hugging Face.
      # Per group (each fetches different files), saved under a fresh key every run
      # so newly pinned revisions are kept; restore takes the latest prefix match.
      - name: Cache Hugging Face downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ matrix.group }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            hf-${{ runner.os }}-${{ matrix.group }}-
            hf-${{ runner.os }}-

      # [rl] (Stable-Baselines3) so the SB3 tests run instead of skipping, among
      # them the tier-1 SB3 -> ONNX export check (test_export_onnx.py).
      # On Python >=3.14, mjlab (<3.14) does not cap mujoco and UV_NO_SYNC=true
      # skips uv.lock, so pin mujoco to the locked >=3.14 baseline version (3.14.0).
      # On Python 3.15, h5py has no stable cp315 wheel on PyPI yet and usd-core
      # ships neither cp315 wheels nor an sdist.
      - name: Install project and pytest
        run: |
          if [ "${{ matrix.python-version }}" = "3.15" ]; then
            uv pip install \
              --find-links https://pypi.anaconda.org/scientific-python-nightly-wheels/simple/h5py/ \
              --only-binary h5py \
              --prerelease=allow \
              h5py
          fi
          case "${{ matrix.python-version }}" in
            3.14|3.15) uv pip install -e ".[mjlab,rl]" "mujoco==3.14.0" ;;
            *)         uv pip install -e ".[mjlab,rl]" ;;
          esac
          uv pip install pytest pytest-xvfb pytest-benchmark ffmpeg torch ipython "musclemimic_models==1.0.6" "usd-core; python_version < '3.15'" "pytest-testmon; python_version < '3.15'"

      - name: Check and report resolved dependencies
        run: |
          uv pip check
          uv pip list

      - name: Pytest tier-1 (fast, backend-agnostic contracts)
        if: ${{ runner.os != 'Linux' }}
        run: uv run python -m pytest -o addopts= myosuite/tests -m "tier1 and not slow" -v

      # One process per job: with pytest-xdist, two workers already reach ~14 GB on
      # the mjlab tests (16 GB runners) and offscreen MuJoCo rendering can abort a worker.
      # Affected-test selection (pytest-testmon) for the Linux 3.11 cpu and mjlab groups: every push
      # to dev records which code each test runs; a PR into dev restores that record
      # and runs only the tests whose code it changed.
      - name: Restore testmon data
        id: testmon
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.11' && matrix.group != 'all' && github.base_ref == 'dev' }}
        uses: actions/cache/restore@v4
        with:
          path: .testmondata
          key: testmon-${{ matrix.group }}-${{ github.event.pull_request.base.sha }}
          restore-keys: testmon-${{ matrix.group }}-

      - name: Pytest — full suite (tier 1–3, all backends; excludes @slow)
        if: ${{ runner.os == 'Linux' }}
        timeout-minutes: 25
        env:
          SELECT: ${{ matrix.group == 'cpu' && 'not slow and not mjlab' || matrix.group == 'mjlab' && 'not slow and mjlab' || 'not slow' }}
          # select: PR into dev with Python-only changes and a recorded baseline.
          # record: push to dev (the baseline for later PRs). Otherwise run everything.
          TESTMON: ${{ (github.base_ref == 'dev' && steps.changes.outputs.only_python == 'true' && steps.testmon.outputs.cache-matched-key != '') && 'select' || (github.event_name == 'push' && github.ref == 'refs/heads/dev' && matrix.python-version == '3.11' && matrix.group != 'all') && 'record' || 'off' }}
          NO_SYNC: ${{ matrix.python-version == '3.15' && '--no-sync' || '' }}
        run: |
          set -euo pipefail
          echo "testmon: $TESTMON"
          # Log runner memory every 30 s, so an out-of-memory runner loss shows its trend.
          # Stopped on exit (with its sleep), so it never holds the step's output open.
          # Needs free and pkill, so it is skipped where either is missing (e.g. Git Bash on Windows).
          if command -v free > /dev/null && command -v pkill > /dev/null; then
            (while sleep 30; do free -m | awk 'NR==2 {print "[mem] used " $3 " MB / " $2 " MB"}'; done) &
            mem_logger=$!
            trap 'pkill -P "$mem_logger" 2>/dev/null; kill "$mem_logger" 2>/dev/null || true' EXIT
          fi
          case "$TESTMON" in
            select)
              # These guards include import-time and subprocess behaviour testmon
              # cannot observe. Keep them independent of its affected-test record.
              uv run ${NO_SYNC:-} python -m pytest -o addopts= -p no:pytest-testmon -v --durations=30 -m "$SELECT" \
                myosuite/tests/test_model_builder.py \
                myosuite/tests/test_terms_cpu.py \
                myosuite/tests/test_term_catalog.py \
                myosuite/tests/test_fragment_compat.py \
                myosuite/tests/test_parity.py \
                myosuite/tests/test_registry.py \
                myosuite/tests/test_import_footprint.py \
                myosuite/tests/test_mjlab_warning_filters.py \
                myosuite/tests/test_train_mjlab.py
              # Exit code 5: no test is affected by the change.
              status=0
              uv run ${NO_SYNC:-} python -m pytest -o addopts= myosuite/tests -v --durations=30 -m "$SELECT" --testmon-forceselect || status=$?
              if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then exit "$status"; fi ;;
            record)
              uv run ${NO_SYNC:-} python -m pytest -o addopts= myosuite/tests -v --durations=30 -m "$SELECT" --testmon ;;
            *)
              uv run ${NO_SYNC:-} python -m pytest -o addopts= myosuite/tests -v --durations=30 -m "$SELECT" ;;
          esac

      - name: Checkpoint testmon data
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.11' && matrix.group != 'all' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        run: |
          uv run python - <<'PY'
          import sqlite3

          with sqlite3.connect("file:.testmondata?mode=rw", uri=True, timeout=0) as database:
              busy, _, _ = database.execute("PRAGMA wal_checkpoint(TRUNCATE)").fetchone()
              if busy:
                  raise SystemExit("testmon WAL checkpoint is busy; refusing to cache incomplete data")
          PY

      - name: Save testmon data
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.11' && matrix.group != 'all' && github.event_name == 'push' && github.ref == 'refs/heads/dev' }}
        uses: actions/cache/save@v4
        with:
          path: .testmondata
          key: testmon-${{ matrix.group }}-${{ github.sha }}

      # @slow tests (benchmarks, long rollouts) only on the nightly run.
      - name: Pytest — slow tests (nightly)
        if: ${{ runner.os == 'Linux' && matrix.group == 'cpu' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        run: uv run python -m pytest -o addopts= myosuite/tests -v -m slow

      # Pinned to 3.11: several tutorials depend on packages with tighter ceilings
      # than the library itself. On a PR into dev, only when it touches tutorials;
      # every push, release PR and nightly run executes them.
      - name: Execute tutorials (discovered; HF-heavy notebooks skipped in CI)
        if: ${{ runner.os == 'Linux' && matrix.python-version == '3.11' && matrix.group == 'cpu' && (github.base_ref != 'dev' || steps.changes.outputs.tutorials == 'true') }}
        run: source myosuite/tests/test_tutorials.sh
