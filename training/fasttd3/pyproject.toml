[project]
name = "myosuite-fasttd3"
version = "0.1.0"
description = "Official FastTD3 trainer for MyoSuite environments (mjlab and CPU)"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "MyoSuite Authors" }]
dependencies = [
    "myosuite",
    "fast_td3 @ git+https://github.com/younggyoseo/FastTD3.git@229ed59bbf43ea2f7a2d5d90d1076314839944d7",
    "tensordict>=0.5",
    "torch",
]

[project.optional-dependencies]
mjlab = [
    "mjlab>=1.4.0",
    "mujoco>=3.13.0",
    "mujoco-warp>=3.8.0",
    "warp-lang>=1.12.0",
]
mimic = [
    "musclemimic_models==1.0.6",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
train-fasttd3 = "myosuite_fasttd3.train:main"

[project.urls]
Homepage = "https://www.myosuite.org"
Upstream = "https://github.com/younggyoseo/FastTD3"

[build-system]
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["myosuite_fasttd3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
