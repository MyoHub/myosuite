[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chasetag-teacher"
version = "0.1.0"
description = "Collect 546→354 ChaseTag pairs from ChaseTagSteeredPair"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
include = ["chasetag_teacher*"]
