
[project]
name = "MyoSuite"
dynamic = ["version"]  # Enable dynamic version
description = "Musculoskeletal environments simulated in MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Vittorio Caggiano", email = "caggiano@gmail.com" },
    { name = "Balint Hodossy", email = "hodossy@gmail.com" },
    { name = "Florian Fischer", email = "florian.fischer26@gmail.com" },

]
urls = { Homepage = "https://www.myosuite.org" }
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy",
    "scipy",
    "mujoco<4",
    "myo-sim==0.2.5",
    "gymnasium>=1.0,<2",
    # Core registered envs (myoFullBodyDirectional-v0, ChaseTagFBVs) download
    # reference gait clips at runtime via hf_hub_download -- not gated behind
    # the [musclemimic] extra since these envs are reachable via plain make_env.
    "huggingface_hub>=0.20",
    # Also enforce this floor with pip (tool.uv constraints only affect uv; huggingface_hub pulls filelock).
    "filelock>=4.2.5; python_version >= '3.11'",
    "click>=8.3.3",
    "termcolor",
    "ml-collections>=0.1.1",
    "colorednoise>=2.2.0",
]
[project.optional-dependencies]
# Biomechanical solvers (differential IK via mink and QP static optimization / CMC via OSQP).
biomechanics = [
    "osqp",
    # solve_ik runs on mink. mink>=1.3.0, needed on 3.14 (the first release without its
    # own <3.14 cap), also raises mink's mujoco floor, so older interpreters take any 1.x.
    "mink>=1.0.0; python_version < '3.14'",
    "mink>=1.3.0; python_version >= '3.14'",
]
# Read and retarget .c3d marker files in myosuite.integrations.marker_retarget.retarget (HDF5 traces live in [viz]).
capture = [
    "ezc3d>=1.5",
    "myosuite[biomechanics]",
]
# ONNX Runtime has no cp315 wheels yet. Native CPU environments do not use it.
onnx = [
    "onnxruntime<1.21; python_version < '3.14'",
    "onnxruntime>=1.24.1; python_version >= '3.14'",
]
# Offscreen video export, rollout plotting, HDF5 trace logging, and interactive viewers.
viz = [
    "imageio[ffmpeg]",
    "h5py",
    "matplotlib>=3.10.8",
    # Patched Pillow wheels require Python >=3.11; 3.10 retains known advisories.
    "Pillow>=13.0.0; python_version >= '3.11'",
    "Pillow>=12.3.0,<13; python_version < '3.11'",
    # mjviser>=0.0.17 depends on mujoco-core>=4.0.1, which installs MuJoCo 4
    # into site-packages/mujoco/ over mujoco<4 on unpinned pip/uv installs.
    "mjviser>=0.0.14,<0.0.17",
    "loop-rate-limiters>=1.2.0",
]
# Reinforcement learning training with Stable-Baselines3
rl = [
    "stable-baselines3>=2.7.1",
    # SB3 pulls matplotlib; pin for NumPy 2 ABI compatibility (avoids _ARRAY_API errors).
    "matplotlib>=3.9.0",
    "Pillow>=13.0.0; python_version >= '3.11'",
    "Pillow>=12.3.0,<13; python_version < '3.11'",
    "joblib>=1.5.3",
    "scikit-learn>=1.6.1",
    "wandb>=0.25.0",
    "tensorboard>=2.20.0",
    "onnx>=1.16.0; python_version < '3.15'",
    "myosuite[onnx]; python_version < '3.15'",
]
# Backward-compatible bundle of former default dependencies and CPU tutorial packages.
examples = [
    "myosuite[biomechanics,rl,viz]",
    "myosuite[onnx]; python_version < '3.15'",
    # ezc3d publishes binary wheels for macOS and x86_64/AMD64 Linux & Windows only.
    "myosuite[capture]; python_version < '3.15' and (sys_platform == 'darwin' or platform_machine == 'x86_64' or platform_machine == 'AMD64')",
    "pandas",
    "scikit-learn>=1.7.2",
    "joblib>=1.5.3",
]
# Convenience superset of CPU extras (biomechanics, capture, viz, onnx, rl, musclemimic, examples).
all = [
    "myosuite[examples,musclemimic]",
]
mjlab = [
    "torch>=2.13.0; python_version >= '3.10'",
    "mjlab>=1.4.0; python_version >= '3.10' and python_version < '3.14'",
    "mujoco-warp>=3.7.0,<4; python_version >= '3.10' and python_version < '3.14'",
    "warp-lang>=1.12.0; python_version >= '3.10'",
    # mjlab pulls mjviser transitively; cap <0.0.17 so `pip install "myosuite[mjlab]"`
    # cannot pull mujoco-core>=4.0.1 over mujoco<4.
    "mjviser>=0.0.14,<0.0.17; python_version >= '3.10' and python_version < '3.14'",
    "Pillow>=13.0.0; python_version >= '3.11'",
    "Pillow>=12.3.0,<13; python_version < '3.11'",
    # mjlab's own rsl_rl dependency (rsl-rl-lib) still passes the deprecated
    # wandb.Settings(start_method=...) kwarg; wandb>=0.29.0 rewrote Settings to
    # reject unknown fields there, so an unpinned resolve breaks
    # runner.learn()'s first call to init_logging_writer() with a pydantic
    # ValidationError ("Extra inputs are not permitted") the moment training
    # actually starts -- not at install time. mjlab itself requires
    # wandb>=0.22.3; verified 0.22.3-0.28.0 all accept start_method (with a
    # harmless deprecation warning), 0.29.0 is the first to reject it.
    "wandb>=0.22.3,<0.29.0; python_version >= '3.10' and python_version < '3.14'",
    "myosuite[onnx]; python_version < '3.15'",
]

mjx = [
    # brax's PPO trainer calls jax.device_put_replicated, removed in jax>=0.5.3 —
    # cap the floor below that line until brax drops the call (verified against
    # brax 0.10-0.14 series). Without this, an unpinned resolve can silently
    # break MJX training on any platform, not just the macOS exclusion below.
    "jax>=0.4.20,<0.5.3; python_version >= '3.10' and sys_platform != 'win32' and sys_platform != 'darwin'",
    "jaxlib>=0.4.20,<0.5.3; python_version >= '3.10' and sys_platform != 'win32' and sys_platform != 'darwin'",
    "brax>=0.10.0; python_version >= '3.10' and sys_platform != 'win32' and sys_platform != 'darwin'",
    "flax>=0.8.0; python_version >= '3.10' and sys_platform != 'win32' and sys_platform != 'darwin'",
    "optax>=0.1.7; python_version >= '3.10' and sys_platform != 'win32' and sys_platform != 'darwin'",
    # orbax-checkpoint>=0.11.25 requires jax>=0.6.0, incompatible with the
    # jax<0.5.3 cap above (brax API removal) — cap below that floor bump.
    # Floor raised to 0.11.22: brax (above) declares
    # orbax-checkpoint>=0.11.22 itself, so anything below that conflicts
    # with it at resolve time. Ceiling tightened to <0.11.24: 0.11.24 calls
    # jax.monitoring.record_scalar(), an API that doesn't exist anywhere in the
    # jax<0.5.3 range above (added later, alongside the same jax>=0.6.0 bump
    # that forced the >=0.11.25 floor) — AttributeError at checkpoint-restore
    # time, not at install time, so it isn't caught by dependency resolution.
    # Verified working end-to-end (Orbax checkpoint restore) on 0.11.22/0.11.23
    # against jax==0.5.2; 0.11.24 reproducibly fails the same restore.
    "orbax-checkpoint>=0.11.22,<0.11.24; python_version >= '3.10' and sys_platform != 'win32' and sys_platform != 'darwin'",
    "ml-collections>=0.1.1; python_version >= '3.10' and sys_platform != 'win32' and sys_platform != 'darwin'",
    "etils[epath]>=1.3.0; python_version >= '3.10' and sys_platform != 'win32'",
    # No `playground`: 1.0 dropped JAX/MJX for torch and MuJoCo Warp, and the
    # few pieces of 0.x the backend used live in backends/_experimental_mjx now. warp-lang
    # (for mjx_impl="warp") is what playground 0.2.0 brought besides those.
    "warp-lang>=1.11; python_version >= '3.10' and sys_platform != 'win32'",
    "mediapy>=1.2.0; python_version >= '3.10' and sys_platform != 'win32'",
    "imageio[ffmpeg]>=2.31.0; python_version >= '3.10' and sys_platform != 'win32'",
    "Pillow>=13.0.0; python_version >= '3.11' and sys_platform != 'win32'",
    "Pillow>=12.3.0,<13; python_version < '3.11' and sys_platform != 'win32'",
    "loop-rate-limiters>=1.2.0; python_version >= '3.10' and sys_platform != 'win32'",
    "mjviser>=0.0.14,<0.0.17; python_version >= '3.10' and sys_platform != 'win32'",
    "wandb>=0.21.0; python_version >= '3.10' and sys_platform != 'win32'",
	"mujoco>=3.7",
	# mujoco-mjx 4 requires mujoco-core 4, which installs a second `mujoco` module
	# over MuJoCo 3 (core caps mujoco<4), so `mujoco.mjx` fails to import.
	"mujoco-mjx>=3.7,<4",
]
# CUDA-enabled MJX stack for GPU.
# Install with: uv sync --extra mjx-cuda
mjx-cuda = [
    "myosuite[mjx]",
    "jax[cuda12]>=0.4.30,<0.5.3; python_version >= '3.10' and sys_platform != 'darwin'",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "sphinx-autodoc-typehints>=2.0",
    "sphinx-autoapi>=2.0",
    "myst-parser>=2.0",
]

musclemimic = [
    # 1.0.6 fixed the left-knee coupling and several muscle wraps; checkpoints trained
    # on 1.0.5 (amathislab/mm-10m-2) get that model from model_versions.py.
    "musclemimic_models==1.0.6",
    "myosuite[viz]",
    "myosuite[onnx]; python_version < '3.15'",
    "huggingface_hub>=0.20",
    "scikit-learn>=1.6.1",
    "joblib>=1.4.0",
]

dev = [
    "myosuite[all]",
    "pytest>=9.0.3",
    "pytest-xvfb",
    "pytest-benchmark>=4.0",
    "black>=26.10.1",
    "isort",
    "flake8",
]


[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Ship only the approved myosuite runtime subpackages (never tests, fixtures, or local scratch dirs).
include-package-data = false
packages = { find = { include = [
    "myosuite",
    "myosuite.benchmarks",
    "myosuite.benchmarks.*",
    "myosuite.biomechanics",
    "myosuite.biomechanics.*",
    "myosuite.core",
    "myosuite.core.*",
    "myosuite.envs",
    "myosuite.envs.*",
    "myosuite.integrations",
    "myosuite.integrations.*",
    "myosuite.logger",
    "myosuite.logger.*",
    "myosuite.motion",
    "myosuite.motion.*",
    "myosuite.physics",
    "myosuite.physics.*",
    "myosuite.policies",
    "myosuite.policies.*",
    "myosuite.scenes",
    "myosuite.scenes.*",
    "myosuite.terms",
    "myosuite.terms.*",
    "myosuite.utils",
    "myosuite.utils.*",
    "myosuite.viz",
    "myosuite.viz.*",
], exclude = [
    "myosuite.agents",
    "myosuite.agents.*",
    "myosuite.tests",
    "myosuite.tests.*",
] } }

[tool.setuptools.package-data]
"myosuite" = [
    # Keep distribution size down by excluding `myosuite/agents/**` and `myosuite/tests/**`.
    "benchmarks/**",
    "biomechanics/**",
    "core/**",
    "envs/**",
    "integrations/**",
    "logger/**",
    "motion/**",
    "physics/**",
    "policies/**",
    "scenes/**",
    "terms/**",
    "utils/**",
    "viz/**",
]

[tool.setuptools.exclude-package-data]
# Keep tests/fixtures, docs-only MJX benchmark plots, and local caches out of the wheel.
"myosuite" = [
    "tests/**",
    "envs/backends/_experimental_mjx/*.png",
    "**/logs/**",
    "**/wandb/**",
    "**/__pycache__/*",
    "**/*.pyc",
    "**/.myosuite_resolved_*.xml",
]

[project.scripts]
myosuite-export-onnx = "myosuite.policies.export_onnx:main"
myosuite-terms = "myosuite.benchmarks.term_catalog:main"
# MuscleMimic full-body: native --path trajectory playback, preview, or MJX smoke.
myosuite-musclemimic-fullbody-eval = "myosuite.benchmarks.musclemimic_fullbody_eval_cli:main"
# Demo motion cache (HF); runs in MuscleMimic tree — see integrations/musclemimic/README.md.
myosuite-musclemimic-setup-demo-cache = "myosuite.integrations.musclemimic.setup_demo_cache_cli:main"

[tool.pytest.ini_options]
# Default: run only fast tests (unit-test compatible). Use: pytest -m slow for slow tests.
addopts = ["-m", "not slow"]
markers = [
    "tier1: Fast core unit/contract/regression tests for main CI.",
    "tier2: Extended backend/parity/backend tests (MJX, mjlab, SAR, heavy env-specific checks).",
    "tier3: Performance, tutorials, and legacy integration tests.",
    "slow: Slow-running tests (benchmarks, long rollouts, or heavy external deps).",
    "legacy: Tests that exercise deprecated BaseV0/env_base paths or legacy-style APIs.",
    "mjlab: Tests in modules that use mjlab / MuJoCo Warp (set by conftest.py; CI runs them in their own job).",
]
# A test module with no explicit `pytestmark = pytest.mark.tierN` is defaulted to
# tier2 by myosuite/tests/conftest.py (with a warning), so `-m tierN` never
# silently drops a whole file. Add an explicit marker to re-tier.

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]

[project.entry-points."mjlab.tasks"]
myosuite = "myosuite.envs.backends.mjlab.bootstrap"

[tool.setuptools.dynamic]
version = {attr = "myosuite.version.__version__"}

[tool.ruff]
extend-exclude = ["tutorials"]

[tool.ruff.lint.per-file-ignores]
"tutorials/**" = ["E402"]

[tool.uv]
# Floors for vulnerable transitive deps. The `[mjx]` extra still pins jax<0.5.3
# while orbax-checkpoint wants jax>=0.6; MJX is opt-in and not part of `[dev]`.
constraint-dependencies = [
    "torch>=2.13.0",
    "certifi>=2026.10.18",
    "cryptography>=48.0.1",
    "idna>=3.15",
    "lxml>=6.1.0",
    # filelock 4.2.1 clears the current advisories and requires Python >=3.11.
    # Later 3.x releases add advisories and still do not clear the old ones.
    "filelock>=4.2.5; python_version >= '3.11'",
    "filelock>=3.25.2,<3.28; python_version < '3.11'",
    "Pillow>=13.0.0; python_version >= '3.11'",
    "Pillow>=12.3.0,<13; python_version < '3.11'",
    "gitpython>=3.2.1",
    "msgpack>=1.2.3",
    "paramiko>=5.0.0",
    "setuptools>=84.1.0",
    "urllib3>=2.7.0",
]
